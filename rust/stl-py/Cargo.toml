[package]
name = "stl-py"
description = "PyO3 bindings exposing stl-core to the Python app as the `stl_native` module"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The Python module name; the crate is a cdylib that maturin installs as a wheel.
name = "stl_native"
crate-type = ["cdylib"]

[dependencies]
bytemuck = "1.25.2"
heed = "0.22.1"
# abi3-py312: one build works on every CPython from 3.12 on (the app runs 3.14).
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
rusqlite = "0.40.2"
stl-core = { version = "0.1.0", path = "../stl-core" }

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "stl-native"
description = "Native (Rust) core for stlLibrary; optional, the app falls back to Python"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.maturin]
module-name = "stl_native"
features = ["pyo3/extension-module"]

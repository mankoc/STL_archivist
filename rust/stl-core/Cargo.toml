[package]
name = "stl-core"
description = "StlArchivist core: storage, archives, hashing, crawler and services (no UI, no Python)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.5.2"
fancy-regex = "0.19.2"
fast_image_resize = "6.1.0"
flate2 = "1.1.10"
gemm = "0.19.0"
heed = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff"] }
jpeg-decoder = "0.3.2"
# AVIF images: the container (avif-parse) and the AV1 decoder (rav1d, the Rust port of
# dav1d), without its assembly so building needs no nasm.
avif-parse = "2.1.0"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
# Model files for the viewer (vendored from MeshPeek, see meshpeek-core/README.md).
meshpeek-core = { path = "../meshpeek-core" }
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde_json = "1.0.140"
sevenz-rust2 = "0.24.0"
sqlite-vec = "=0.1.9"
unicode-normalization = "0.1.26"
uuid = { version = "1.28.0", features = ["v4"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3", "xxh64"] }

[dev-dependencies]
zip = { version = "9.0.5", default-features = false }
tempfile = "3.27.0"

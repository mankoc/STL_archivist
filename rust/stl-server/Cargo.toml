[package]
name = "stl-server"
description = "stlLibrary server: HTTP + WebSocket API over stl-core (Phase 5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
heed = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-17"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
stl-core = { version = "0.1.0", path = "../stl-core" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
jpeg-decoder = "0.3.2"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.0.5", default-features = false }

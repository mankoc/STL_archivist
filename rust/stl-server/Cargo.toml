[package]
name = "stl-server"
description = "stlLibrary server: HTTP + WebSocket API over stl-core (Phase 5)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4"
rayon = "1.12.0"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
heed = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-17", "directml", "cuda", "migraphx", "rocm", "openvino"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
stl-core = { path = "../stl-core" }
stl-proc = { path = "../stl-proc" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
http-body-util = "0.1.5"
jpeg-decoder = "0.3.2"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.0.5", default-features = false }

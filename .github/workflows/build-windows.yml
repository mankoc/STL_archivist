name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=dev-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          # Swap onnxruntime for DirectML variant: works with NVIDIA / AMD / Intel
          # via Windows-native DirectML API — no CUDA install required on user machines.
          pip uninstall -y onnxruntime
          pip install onnxruntime-directml

      - name: Verify AI runtime imports
        run: |
          python -c "
          import onnxruntime as ort
          print('onnxruntime', ort.__version__, '| providers:', ort.get_available_providers())
          from transformers import AutoProcessor
          from transformers.models.qwen2_vl.image_processing_qwen2_vl import Qwen2VLImageProcessor
          import numpy as np
          print('transformers + numpy OK')
          "

      - name: Build executable
        run: pyinstaller stl_database.spec --noconfirm

      - name: Rename executable with version
        shell: bash
        run: mv dist/stlLibrary.exe "dist/stlLibrary-${{ steps.version.outputs.value }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: stlLibrary-windows-${{ steps.version.outputs.value }}
          path: dist/stlLibrary-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: STL Database ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(steps.version.outputs.value, 'alpha') || contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'rc') }}
          generate_release_notes: true
          files: dist/stlLibrary-${{ steps.version.outputs.value }}.exe

name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=dev-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build executable
        run: pyinstaller stl_database.spec

      - name: Rename executable with version
        shell: bash
        run: mv dist/STLDatabase.exe "dist/STLDatabase-${{ steps.version.outputs.value }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: STLDatabase-windows-${{ steps.version.outputs.value }}
          path: dist/STLDatabase-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: STL Database ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(steps.version.outputs.value, 'alpha') || contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'rc') }}
          generate_release_notes: true
          files: dist/STLDatabase-${{ steps.version.outputs.value }}.exe

name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=dev-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          # Swap onnxruntime for the DirectML variant: works with NVIDIA / AMD / Intel
          # via the Windows-native DirectML API — no CUDA install required on end-user machines.
          pip uninstall -y onnxruntime
          pip install onnxruntime-directml
          # Use Python to safely uninstall optional/dev packages that must not enter the exe.
          # subprocess with check=False silently skips packages that were never installed.
          python -c "
          import subprocess, sys
          for pkg in ['torch', 'torchvision', 'torchaudio', 'pytest', 'pytest-cov']:
              subprocess.run(
                  [sys.executable, '-m', 'pip', 'uninstall', '-y', pkg],
                  check=False, capture_output=True,
              )
          "

      - name: Verify AI runtime imports
        run: |
          python -c "
          import onnxruntime as ort
          print('onnxruntime', ort.__version__, '| providers:', ort.get_available_providers())
          assert 'DmlExecutionProvider' in ort.get_available_providers(), 'DmlExecutionProvider missing'
          from transformers import AutoTokenizer
          import numpy as np
          # Confirm torch was not accidentally pulled in
          try:
              import torch
              raise SystemExit('ERROR: torch must not be installed in the build environment')
          except ImportError:
              pass
          print('All checks passed — onnxruntime-directml + transformers + numpy OK, no torch')
          "

      - name: Build executable
        run: pyinstaller stl_database.spec --noconfirm

      - name: Rename executable with version
        shell: bash
        run: mv dist/stlLibrary.exe "dist/stlLibrary-${{ steps.version.outputs.value }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: stlLibrary-windows-${{ steps.version.outputs.value }}
          path: dist/stlLibrary-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: STL Database ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(steps.version.outputs.value, 'alpha') || contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'rc') }}
          generate_release_notes: true
          files: dist/stlLibrary-${{ steps.version.outputs.value }}.exe

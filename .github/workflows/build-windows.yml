name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "value=dev-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib
          # AI packages (torch, transformers, qwen-vl-utils) are downloaded on
          # demand at runtime — they must NOT be present in the build environment.
          python -c "
          import subprocess, sys
          for pkg in ['torch', 'torchvision', 'torchaudio', 'transformers',
                      'qwen-vl-utils', 'accelerate', 'onnxruntime',
                      'onnxruntime-directml', 'pytest', 'pytest-cov']:
              subprocess.run(
                  [sys.executable, '-m', 'pip', 'uninstall', '-y', pkg],
                  check=False, capture_output=True,
              )
          "

      - name: Verify build environment
        run: |
          python -c "
          # Confirm AI packages were NOT accidentally pulled in
          for pkg in ('torch', 'transformers', 'qwen_vl_utils', 'onnxruntime'):
              try:
                  __import__(pkg)
                  raise SystemExit(f'ERROR: {pkg} must not be installed in the build environment')
              except ImportError:
                  pass
          # Confirm core app imports work
          from app.utils.ai_runtime import is_ai_ready, ai_packages_dir, INSTALL_VARIANTS
          assert 'cpu' in INSTALL_VARIANTS
          assert 'cu128' in INSTALL_VARIANTS
          print('Build environment OK — no AI packages bundled, ai_runtime imports clean')
          "

      - name: Build executable
        run: pyinstaller stl_database.spec --noconfirm

      - name: Rename executable with version
        shell: bash
        run: mv dist/stlLibrary.exe "dist/stlLibrary-${{ steps.version.outputs.value }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: stlLibrary-windows-${{ steps.version.outputs.value }}
          path: dist/stlLibrary-${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: STL Database ${{ steps.version.outputs.value }}
          tag_name: ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(steps.version.outputs.value, 'alpha') || contains(steps.version.outputs.value, 'beta') || contains(steps.version.outputs.value, 'rc') }}
          generate_release_notes: true
          files: dist/stlLibrary-${{ steps.version.outputs.value }}.exe

name: Server, web client and desktop shell

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web client
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  # What the Docker image ships. The desktop shell stays on Windows: it needs WebKitGTK here.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust tests
        working-directory: rust
        run: cargo test -p stl-core -p stl-server -p stl-proc

  # Known advisories, reported without failing the run.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependencies
        working-directory: rust
        run: cargo audit

      - name: Web dependencies
        if: always()
        working-directory: web
        run: npm audit --audit-level=high

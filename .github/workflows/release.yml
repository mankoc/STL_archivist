name: Windows installer

# Builds StlArchivist_<version>_x64-setup.exe (the desktop app with the server and
# the web client) when a version tag is pushed (git tag v2026.43.0 && git push
# origin v2026.43.0), and publishes it on a GitHub release. It can also be started
# by hand (Actions → Windows installer → Run workflow): then the installer is only
# kept as a run artifact. Ordinary pushes do not run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: 2.12.3

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The Tauri CLI takes minutes to compile: keep it between runs.
      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content rust/stl-desktop/tauri.bundle.json -Raw | ConvertFrom-Json).version
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match the version $v in tauri.bundle.json"
          }

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Installer

      # A run started by hand keeps the installer as an artifact, for a week; a tag
      # puts it on the release instead (artifacts count against the account's storage).
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: StlArchivist-${{ steps.version.outputs.value }}-installer
          path: rust/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StlArchivist ${{ steps.version.outputs.value }}
          files: rust/target/release/bundle/nsis/*.exe
          generate_release_notes: true

name: Release

# Actions → Release → Run workflow. From development: raises the version
# (tools/version.py release: "## Unreleased" in CHANGELOG.md becomes its section),
# commits that to development, merges development into main, tags v<version>, builds
# the installer and the Docker image, and publishes the GitHub release (its notes are
# the version's changelog section) with the installer, and <image>:<version> and
# <image>:latest. A tag pushed by a workflow starts no other workflow, so this one runs
# the builds itself.
on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Version, changelog, merge and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits development lacks: merge main into development first"
            exit 1
          fi
          version=$(python tools/version.py release)
          (cd rust && cargo metadata --format-version 1 > /dev/null) # Cargo.lock takes the version
          python tools/version.py notes "$version" > "$RUNNER_TEMP/notes.md"
          git add -A
          git commit -m "release: $version"
          git push origin HEAD:development
          git push origin HEAD:main
          git tag "v$version"
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v$VERSION" --draft --title "StlArchivist $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  installer:
    needs: prepare
    uses: ./.github/workflows/installer.yml
    with:
      ref: v${{ needs.prepare.outputs.version }}

  docker:
    needs: prepare
    uses: ./.github/workflows/docker.yml
    with:
      ref: v${{ needs.prepare.outputs.version }}
      tags: |
        ${{ needs.prepare.outputs.version }}
        latest
      publish: true
    secrets: inherit

  publish:
    needs: [prepare, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Publish the release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "v$VERSION" installer/*.exe --clobber
          gh release edit "v$VERSION" --draft=false --latest
